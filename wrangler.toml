# Cloudflare Pages configuration.
#
# IMPORTANT: If you deploy via the Cloudflare dashboard (connecting your
# GitHub repo through the web UI, which is the normal path), this file is
# often NOT read automatically for compatibility flags — you also need to
# set "nodejs_compat" manually in the dashboard:
# Pages project → Settings → Functions → Compatibility flags → add
# "nodejs_compat" for BOTH Production and Preview.
#
# Without that flag, the Stripe SDK will fail to load, since it expects a
# few small Node.js built-ins to exist even when using the fetch-based
# HTTP client.

name = "lalilly-checkout-test"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Plain (non-secret) environment variables. Unlike the encrypted "Secrets"
# on the dashboard, these are committed here in plain text — fine for
# flags like this that aren't sensitive.
[vars]
LALILLY_TEST_STAGE = "true"
LALILLY_STAGE_RUN = "false"
ENABLE_STRIPE_TAX = "true"
# Woo routing remains off until real Tapstitch products and unpaid sync tests pass.
WOOCOMMERCE_ENABLED = "true"
WOOCOMMERCE_URL = "https://store.lillypug.com"
WOOCOMMERCE_ALLOW_LIVE_CHECKOUT = "false"
WOOCOMMERCE_ORDER_MODE = "review"
WOOCOMMERCE_VARIANTS_JSON = '{"31":[{"size":"S","color":"Black","productId":30,"variationId":41,"sku":"1564302106440105984","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"S"}]},{"size":"M","color":"Black","productId":30,"variationId":42,"sku":"1564302106440105985","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"M"}]},{"size":"L","color":"Black","productId":30,"variationId":43,"sku":"1564302106440105986","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"L"}]},{"size":"XL","color":"Black","productId":30,"variationId":44,"sku":"1564302106440105987","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"XL"}]},{"size":"2XL","color":"Black","productId":30,"variationId":45,"sku":"1564302106440105988","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"2XL"}]},{"size":"3XL","color":"Black","productId":30,"variationId":46,"sku":"1564302106440105989","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"3XL"}]},{"size":"S","color":"White","productId":30,"variationId":35,"sku":"1564302106440105990","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"S"}]},{"size":"M","color":"White","productId":30,"variationId":36,"sku":"1564302106440105991","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"M"}]},{"size":"L","color":"White","productId":30,"variationId":37,"sku":"1564302106440105992","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"L"}]},{"size":"XL","color":"White","productId":30,"variationId":38,"sku":"1564302106440105993","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"XL"}]},{"size":"2XL","color":"White","productId":30,"variationId":39,"sku":"1564302106440105994","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"2XL"}]},{"size":"3XL","color":"White","productId":30,"variationId":40,"sku":"1564302106440105995","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"3XL"}]}]}'
# Brevo contact list to add newsletter signups to. Not sensitive — the
# actual API key (BREVO_API_KEY) is a Secret set in the Cloudflare
# dashboard instead, since that one needs to stay private.
BREVO_LIST_ID = "3"

# Order tracking storage. This binding is picked up automatically from
# this file (see the "Bindings for this project are being managed through
# wrangler.toml" note in the dashboard) — no manual dashboard step needed,
# just commit this file with your real namespace ID below.
[[kv_namespaces]]
binding = "ORDERS"
id = "57238fbfef0148d4b231d6d8f78d8995"
