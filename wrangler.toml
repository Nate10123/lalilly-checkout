# Cloudflare Pages configuration.
#
# IMPORTANT: If you deploy via the Cloudflare dashboard (connecting your
# GitHub repo through the web UI, which is the normal path), this file is
# often NOT read automatically for compatibility flags — you also need to
# set "nodejs_compat" manually in the dashboard:
# Pages project → Settings → Functions → Compatibility flags → add
# "nodejs_compat" for BOTH Production and Preview.
#
# Without that flag, the Stripe SDK will fail to load, since it expects a
# few small Node.js built-ins to exist even when using the fetch-based
# HTTP client.

name = "lalilly-checkout-test"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Plain (non-secret) environment variables. Unlike the encrypted "Secrets"
# on the dashboard, these are committed here in plain text — fine for
# flags like this that aren't sensitive.
[vars]
LALILLY_TEST_STAGE = "true"
LALILLY_STAGE_RUN = "true"
ENABLE_STRIPE_TAX = "true"
# Woo routing remains off until real Tapstitch products and unpaid sync tests pass.
WOOCOMMERCE_ENABLED = "true"
WOOCOMMERCE_URL = "https://store.lillypug.com"
WOOCOMMERCE_ALLOW_LIVE_CHECKOUT = "false"
WOOCOMMERCE_ORDER_MODE = "review"
WOOCOMMERCE_VARIANTS_JSON = '{"31":[{"size":"S","color":"White","productId":11,"variationId":16,"sku":"1563915623770349573","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"S"}]},{"size":"M","color":"White","productId":11,"variationId":17,"sku":"1563915623770349574","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"M"}]},{"size":"L","color":"White","productId":11,"variationId":18,"sku":"1563915623770349575","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"L"}]},{"size":"XL","color":"White","productId":11,"variationId":19,"sku":"1563915623770349576","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"XL"}]},{"size":"XXL","color":"White","productId":11,"variationId":20,"sku":"1563915623770349577","attributes":[{"name":"Color","option":"White"},{"name":"Size","option":"XXL"}]},{"size":"S","color":"Black","productId":11,"variationId":21,"sku":"1563915623770349568","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"S"}]},{"size":"M","color":"Black","productId":11,"variationId":22,"sku":"1563915623770349569","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"M"}]},{"size":"L","color":"Black","productId":11,"variationId":23,"sku":"1563915623770349570","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"L"}]},{"size":"XL","color":"Black","productId":11,"variationId":24,"sku":"1563915623770349571","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"XL"}]},{"size":"XXL","color":"Black","productId":11,"variationId":25,"sku":"1563915623770349572","attributes":[{"name":"Color","option":"Black"},{"name":"Size","option":"XXL"}]}]}'
# Brevo contact list to add newsletter signups to. Not sensitive — the
# actual API key (BREVO_API_KEY) is a Secret set in the Cloudflare
# dashboard instead, since that one needs to stay private.
BREVO_LIST_ID = "3"

# Order tracking storage. This binding is picked up automatically from
# this file (see the "Bindings for this project are being managed through
# wrangler.toml" note in the dashboard) — no manual dashboard step needed,
# just commit this file with your real namespace ID below.
[[kv_namespaces]]
binding = "ORDERS"
id = "57238fbfef0148d4b231d6d8f78d8995"
