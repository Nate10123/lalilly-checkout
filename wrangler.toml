# Cloudflare Pages configuration.
#
# IMPORTANT: If you deploy via the Cloudflare dashboard (connecting your
# GitHub repo through the web UI, which is the normal path), this file is
# often NOT read automatically for compatibility flags — you also need to
# set "nodejs_compat" manually in the dashboard:
# Pages project → Settings → Functions → Compatibility flags → add
# "nodejs_compat" for BOTH Production and Preview.
#
# Without that flag, the Stripe SDK will fail to load, since it expects a
# few small Node.js built-ins to exist even when using the fetch-based
# HTTP client.

name = "lalilly"
pages_build_output_dir = "."
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Order tracking storage — see the order-tracking setup guide for how to
# create this namespace and get its ID. Like compatibility flags, if you
# deploy via the Cloudflare dashboard's Git integration (the normal path),
# this binding must ALSO be added manually in the dashboard:
# Pages project → Settings → Functions → KV namespace bindings → add
# "ORDERS" pointing at your namespace, for BOTH Production and Preview.
[[kv_namespaces]]
binding = "ORDERS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
