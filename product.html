<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA LILLY — Product</title>
<link rel="icon" type="image/png" href="assets/lalilly-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="utility-bar">
  <span><span class="dot">●</span> Free shipping over $50</span>
  <span>Contact · Instagram · TikTok</span>
</div>

<nav>
  <a href="index.html" class="logo"><img src="assets/lalilly-logo.png" alt="LA LILLY"></a>
  <div class="nav-links">
    <a href="index.html" class="nav-item">Home</a>
    <a href="shop.html" class="nav-item">Shop</a>
    <a href="index.html#drops" class="nav-item">Drops</a>
  </div>
  <div class="nav-icons">
    <button class="cart-btn" onclick="toggleCart(true)">
      Cart <span id="cartCount">0</span> <span id="cartTotal">$0.00</span>
    </button>
  </div>
</nav>

<div class="breadcrumb" id="breadcrumb">
  <a href="index.html">Home</a> / <a href="shop.html">Shop</a> / <span id="breadcrumbName">Product</span>
</div>

<div id="pdpRoot"></div>

<section id="related">
  <h2 class="related-heading">You might also like</h2>
  <div class="product-grid" id="relatedGrid"></div>
</section>

<footer>
  <span>© 2026 LA LILLY — All rights reserved</span>
  <span>Privacy · Terms · Shipping</span>
</footer>

<div class="overlay" id="overlay" onclick="toggleCart(false)"></div>
<aside class="cart-drawer" id="cartDrawer" aria-label="Shopping cart">
  <div class="cart-head">
    <h3>Your Cart</h3>
    <button class="cart-close" onclick="toggleCart(false)" aria-label="Close cart">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="cart-subtotal-row"><span>Subtotal</span><span id="drawerSubtotal">$0.00</span></div>
    <div class="cart-subtotal-row"><span>Shipping</span><span id="drawerShipping">—</span></div>
    <div class="cart-total-row"><span>Total</span><span id="drawerTotal">$0.00</span></div>
    <div class="cart-tax-note">Tax calculated at checkout</div>
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
  </div>
</aside>

<script src="store.js"></script>
<script>
  let selectedQty = 1;

  function getProductIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'), 10);
    return Number.isFinite(id) ? id : null;
  }

  function renderNotFound() {
    document.title = 'LA LILLY — Product not found';
    document.getElementById('breadcrumbName').textContent = 'Not found';
    document.getElementById('pdpRoot').innerHTML = `
      <section class="pdp" style="grid-template-columns: 1fr;">
        <div>
          <h1 class="hero-title" style="font-size:2rem;">This one's not in stock<br>(or never existed).</h1>
          <p class="hero-copy" style="margin-top:16px;">Head back to the shop to find something real.</p>
          <div class="hero-actions">
            <a href="shop.html" class="btn-solid">Back to Shop</a>
          </div>
        </div>
      </section>
    `;
  }

  function changeQty(delta) {
    selectedQty = Math.max(1, Math.min(20, selectedQty + delta));
    const qtyEl = document.getElementById('qtyValue');
    if (qtyEl) qtyEl.textContent = selectedQty;
  }

  let selectedSize = null;
  let selectedColor = null;

  // Figures out what the Add to Cart button should say/allow given what's
  // still unselected — color takes priority since it's the first choice.
  function updateAddButtonState(product) {
    const btn = document.getElementById('addToCartBtn');
    if (!btn) return;
    const needsColor = !!product.colors;
    const needsSize = !!product.sizes;
    const ready = (!needsColor || selectedColor) && (!needsSize || selectedSize);
    btn.disabled = !ready;
    if (needsColor && !selectedColor) btn.textContent = 'Select a Color';
    else if (needsSize && !selectedSize) btn.textContent = 'Select a Size';
    else btn.textContent = 'Add to Cart';
  }

  function renderProduct(product) {
    document.title = `LA LILLY — ${product.name}`;
    document.getElementById('breadcrumbName').textContent = product.name;
    document.body.dataset.currentProductId = product.id;
    selectedSize = null;
    selectedColor = null;

    const colorRow = product.colors ? `
      <div class="pdp-color-row">
        <span class="pdp-size-label">Color<span id="selectedColorName"></span></span>
        <div class="color-options" id="colorOptions">
          ${product.colors.map(c => `<button type="button" class="color-swatch" style="background:${c.hex}" data-color="${c.name}" title="${c.name}" aria-label="${c.name}" onclick="selectColor('${c.name}', this)"></button>`).join('')}
        </div>
      </div>
    ` : '';

    const sizeRow = product.sizes ? `
      <div class="pdp-size-row">
        <span class="pdp-size-label">Size</span>
        <div class="size-options" id="sizeOptions">
          ${product.sizes.map(s => `<button type="button" class="size-chip" data-size="${s}" onclick="selectSize('${s}', this)">${s}</button>`).join('')}
        </div>
      </div>
    ` : '';

    document.getElementById('pdpRoot').innerHTML = `
      <section class="pdp">
        <div class="pdp-art" id="pdpArt" style="background:${product.bg}">
          ${product.tag ? `<span class="product-tag ${product.tag}">${product.tag === 'new' ? 'New' : 'Low Stock'}</span>` : ''}
          ${productMedia(product)}
        </div>
        <div class="pdp-info">
          <span class="cat">${product.catLabel}</span>
          <h1>${product.name}</h1>
          <div class="pdp-price" id="pdpPrice">${getDisplayPrice(product)}</div>
          <p class="pdp-desc">${product.description}</p>
          ${colorRow}
          ${sizeRow}
          <div class="pdp-qty-row">
            <div class="qty-stepper">
              <button onclick="changeQty(-1)" aria-label="Decrease quantity">−</button>
              <span id="qtyValue">1</span>
              <button onclick="changeQty(1)" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div class="pdp-actions">
            <button class="btn-solid" id="addToCartBtn" onclick="addProductToCart(${product.id}, this)" ${(product.sizes || product.colors) ? 'disabled' : ''}>
              Add to Cart
            </button>
            <a href="shop.html" class="btn-outline">Keep Browsing</a>
          </div>
          <div class="pdp-meta">
            <span>Free shipping on orders over $50</span>
            <span>Small-batch — limited restock windows</span>
            <span>Printed and shipped by Printful</span>
          </div>
        </div>
      </section>
    `;

    updateAddButtonState(product);
  }

  function selectSize(size, btn) {
    selectedSize = size;
    document.querySelectorAll('.size-chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');

    const id = parseInt(document.body.dataset.currentProductId, 10);
    const product = PRODUCTS.find(p => p.id === id);
    updateAddButtonState(product);

    // For products priced per-size (like the poster), reflect the chosen
    // size's exact price instead of the "From $X" placeholder.
    if (product && product.sizePricing) {
      const priceEl = document.getElementById('pdpPrice');
      if (priceEl) priceEl.textContent = `$${getUnitPrice(product, size).toFixed(2)}`;
    }
  }

  function selectColor(color, btn) {
    selectedColor = color;
    document.querySelectorAll('.color-swatch').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    const nameEl = document.getElementById('selectedColorName');
    if (nameEl) nameEl.textContent = ' — ' + color;

    const id = parseInt(document.body.dataset.currentProductId, 10);
    const product = PRODUCTS.find(p => p.id === id);

    const artEl = document.getElementById('pdpArt');
    if (artEl && product) {
      const tagHtml = product.tag ? `<span class="product-tag ${product.tag}">${product.tag === 'new' ? 'New' : 'Low Stock'}</span>` : '';
      artEl.innerHTML = tagHtml + productMedia(product, getProductImage(product, color));
    }

    updateAddButtonState(product);
  }

  function addProductToCart(id, btn) {
    const product = PRODUCTS.find(p => p.id === id);
    if (product.sizes && !selectedSize) return; // guarded by disabled state, but just in case
    if (product.colors && !selectedColor) return;
    addToCart(id, selectedQty, btn, selectedSize, selectedColor);
  }

  function renderRelated(currentProduct) {
    const related = PRODUCTS
      .filter(p => p.cat === currentProduct.cat && p.id !== currentProduct.id)
      .slice(0, 4);
    const pool = related.length > 0 ? related : PRODUCTS.filter(p => p.id !== currentProduct.id).slice(0, 4);

    document.getElementById('relatedGrid').innerHTML = pool.map(p => `
      <div class="product-card">
        <a class="product-art-link" href="product.html?id=${p.id}">
          <div class="product-art" style="background:${p.bg}">
            ${p.tag ? `<span class="product-tag ${p.tag}">${p.tag === 'new' ? 'New' : 'Low Stock'}</span>` : ''}
            ${productMedia(p)}
          </div>
        </a>
        <div class="product-info">
          <span class="cat">${p.catLabel}</span>
          <h4><a href="product.html?id=${p.id}">${p.name}</a></h4>
          <div class="product-bottom">
            <span class="price">${getDisplayPrice(p)}</span>
            ${(p.sizes || p.colors)
              ? `<a href="product.html?id=${p.id}" class="add-btn" style="display:inline-block;text-decoration:none;">${p.sizes ? 'Select Size' : 'Select Color'}</a>`
              : `<button class="add-btn" onclick="addToCart(${p.id}, 1, this)">Add</button>`}
          </div>
        </div>
      </div>
    `).join('');
  }

  function init() {
    const id = getProductIdFromUrl();
    const product = id !== null ? PRODUCTS.find(p => p.id === id) : null;
    if (!product) {
      renderNotFound();
      document.getElementById('related').style.display = 'none';
      return;
    }
    renderProduct(product);
    renderRelated(product);
  }

  init();
</script>

</body>
</html>
