<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — LA LILLY</title>
<link rel="icon" type="image/png" href="assets/lalilly-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ec; --ink: #14120f; --hot: #ff2f7e; --lime: #c8ff4d;
    --font-display: 'Archivo Black', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 6vw;
  }
  .card {
    max-width: 480px; text-align: center;
    border: 3px solid var(--ink); padding: 50px 36px; background: var(--paper);
  }
  .badge {
    display: inline-block; background: var(--lime); border: 2px solid var(--ink);
    font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.1em; padding: 5px 12px; margin-bottom: 22px; transform: rotate(-2deg);
  }
  h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.05; margin-bottom: 16px; }
  p { color: rgba(20,18,15,0.7); margin-bottom: 30px; }
  a.btn {
    display: inline-block; background: var(--ink); color: var(--paper);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 0.85rem; padding: 15px 28px; text-decoration: none;
  }
  a.btn-outline {
    display: inline-block; background: transparent; color: var(--ink);
    border: 2px solid var(--ink);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 0.85rem; padding: 13px 28px; text-decoration: none;
    margin-left: 10px;
  }
  .order-ref {
    font-family: var(--font-mono); font-size: 0.8rem; color: rgba(20,18,15,0.55);
    margin-bottom: 30px; word-break: break-all;
  }
  .order-ref strong { color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Confirmed</span>
    <h1>Order placed.<br>We're on it.</h1>
    <p>A receipt is on its way to your inbox from Stripe. We'll get this into production — check back on tracking once it ships.</p>
    <div class="order-ref" id="orderRef"></div>
    <div class="actions">
      <a class="btn" href="/">Back to LA LILLY</a>
      <a class="btn-outline" id="trackLink" href="track.html">Track Your Order</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('orderRef').innerHTML =
        'Order reference: <strong>' + sessionId + '</strong><br>Save this to check your order status later.';
      document.getElementById('trackLink').href = 'track.html?session=' + encodeURIComponent(sessionId);
    }
  </script>
</body>
</html>
