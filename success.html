<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — LA LILLY</title>
<meta name="description" content="Your LA LILLY order is confirmed.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#ff2f7e">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LA LILLY">
<meta property="og:title" content="Order Confirmed — LA LILLY">
<meta property="og:description" content="Your LA LILLY order is confirmed.">
<meta property="og:image" content="https://lalilly-checkout.pages.dev/assets/og-image.png?v=2">
<meta property="og:url" content="https://lalilly-checkout.pages.dev/success.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Order Confirmed — LA LILLY">
<meta name="twitter:description" content="Your LA LILLY order is confirmed.">
<meta name="twitter:image" content="https://lalilly-checkout.pages.dev/assets/og-image.png?v=2">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ec; --ink: #14120f; --hot: #ff2f7e; --lime: #c8ff4d;
    --font-display: 'Archivo Black', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 6vw;
  }
  .card {
    max-width: 480px; text-align: center;
    border: 3px solid var(--ink); padding: 50px 36px; background: var(--paper);
  }
  .badge {
    display: inline-block; background: var(--lime); border: 2px solid var(--ink);
    font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.1em; padding: 5px 12px; margin-bottom: 22px; transform: rotate(-2deg);
  }
  h1 { font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.05; margin-bottom: 16px; }
  p { color: rgba(20,18,15,0.7); margin-bottom: 30px; }
  a.btn {
    display: inline-block; background: var(--ink); color: var(--paper);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 0.85rem; padding: 15px 28px; text-decoration: none;
  }
  a.btn-outline {
    display: inline-block; background: transparent; color: var(--ink);
    border: 2px solid var(--ink);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 0.85rem; padding: 13px 28px; text-decoration: none;
    margin-left: 10px;
  }
  .order-ref {
    font-family: var(--font-mono); font-size: 0.8rem; color: rgba(20,18,15,0.55);
    margin-bottom: 30px; word-break: break-all;
  }
  .order-ref strong { color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .copy-btn {
    background: none; border: none; color: var(--ink); cursor: pointer;
    font-family: var(--font-mono); font-size: 0.72rem; text-decoration: underline;
    padding: 0; margin-left: 8px;
  }
  .copy-btn:hover { color: var(--hot); }
  a.btn:focus-visible, a.btn-outline:focus-visible, .copy-btn:focus-visible {
    outline: 2px solid var(--hot); outline-offset: 2px;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  @keyframes badgePop {
    0% { transform: rotate(-2deg) scale(0.6); opacity: 0; }
    60% { transform: rotate(-2deg) scale(1.08); opacity: 1; }
    100% { transform: rotate(-2deg) scale(1); opacity: 1; }
  }
  .card { animation: cardIn 0.5s ease forwards; }
  .badge { animation: badgePop 0.5s ease 0.15s backwards; }
  @media (prefers-reduced-motion: reduce) {
    .card, .badge { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Confirmed</span>
    <h1>Order placed.<br>We're on it.</h1>
    <p>A receipt is on its way to your inbox from Stripe. We'll get this into production — check back on tracking once it ships.</p>
    <div class="order-ref" id="orderRef"></div>
    <div class="actions">
      <a class="btn" href="/">Back to LA LILLY</a>
      <a class="btn-outline" id="trackLink" href="track.html">Track Your Order</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('orderRef').innerHTML =
        'Order reference: <strong>' + sessionId + '</strong>' +
        '<button type="button" class="copy-btn" id="copyRefBtn">Copy</button>' +
        '<br>Save this to check your order status later.';
      document.getElementById('trackLink').href = 'track.html?session=' + encodeURIComponent(sessionId);

      document.getElementById('copyRefBtn').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(sessionId);
          const btn = document.getElementById('copyRefBtn');
          const original = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = original; }, 1500);
        } catch (err) {
          // Clipboard API unavailable or blocked — the reference text is already visible to select manually.
        }
      });
    }
  </script>
</body>
</html>
