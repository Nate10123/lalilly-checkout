<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — LA LILLY</title>
<link rel="icon" type="image/png" href="assets/lalilly-emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ec; --ink: #14120f; --hot: #ff2f7e; --lime: #c8ff4d;
    --font-display: 'Archivo Black', sans-serif;
    --font-body: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font-body);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 6vw;
  }
  .card {
    max-width: 480px; width: 100%; text-align: center;
    border: 3px solid var(--ink); padding: 50px 36px; background: var(--paper);
  }
  h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.05; margin-bottom: 16px; }
  p.sub { color: rgba(20,18,15,0.7); margin-bottom: 26px; }
  form { display: flex; gap: 8px; margin-bottom: 10px; }
  input {
    flex: 1; border: 2px solid var(--ink); background: transparent; color: var(--ink);
    padding: 13px 14px; font-family: var(--font-mono); font-size: 0.85rem;
  }
  input::placeholder { color: rgba(20,18,15,0.4); }
  button {
    background: var(--ink); color: var(--paper); border: 2px solid var(--ink);
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 0.8rem; padding: 0 20px; cursor: pointer;
  }
  button:hover { background: var(--hot); border-color: var(--hot); }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { font-family: var(--font-mono); font-size: 0.72rem; color: rgba(20,18,15,0.45); margin-bottom: 30px; }
  .result { margin-top: 24px; text-align: left; display: none; }
  .result.visible { display: block; }
  .status-row {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em;
    font-size: 0.85rem; margin-bottom: 14px;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(20,18,15,0.3); flex-shrink: 0; }
  .status-dot.shipped { background: var(--lime); }
  .status-dot.processing { background: var(--hot); }
  .tracking-box {
    border: 2px solid var(--ink); padding: 16px; font-family: var(--font-mono); font-size: 0.85rem;
  }
  .tracking-box a { color: var(--ink); }
  .error-box {
    border: 2px solid var(--hot); padding: 16px; font-family: var(--font-mono);
    font-size: 0.85rem; color: var(--ink); margin-top: 24px; display: none;
  }
  .error-box.visible { display: block; }
  a.back { display: inline-block; margin-top: 30px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); }
</style>
</head>
<body>
  <div class="card">
    <h1>Track Your Order</h1>
    <p class="sub">Enter the order reference from your confirmation page.</p>
    <form id="trackForm">
      <input type="text" id="sessionInput" placeholder="cs_live_..." autocomplete="off">
      <button type="submit" id="trackBtn">Check</button>
    </form>
    <div class="hint">This is the "Order reference" shown on your confirmation page after checkout.</div>

    <div class="result" id="result">
      <div class="status-row">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText"></span>
      </div>
      <div class="tracking-box" id="trackingBox" style="display:none;"></div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <a class="back" href="/">← Back to LA LILLY</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const prefill = params.get('session');
    if (prefill) document.getElementById('sessionInput').value = prefill;

    document.getElementById('trackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sessionId = document.getElementById('sessionInput').value.trim();
      const resultEl = document.getElementById('result');
      const errorEl = document.getElementById('errorBox');
      const btn = document.getElementById('trackBtn');

      resultEl.classList.remove('visible');
      errorEl.classList.remove('visible');
      if (!sessionId) return;

      btn.disabled = true;
      btn.textContent = 'Checking...';

      try {
        const res = await fetch('/api/order-status?session_id=' + encodeURIComponent(sessionId));
        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Something went wrong.';
          errorEl.classList.add('visible');
          return;
        }

        const dot = document.getElementById('statusDot');
        const text = document.getElementById('statusText');
        const trackingBox = document.getElementById('trackingBox');

        if (data.status === 'shipped') {
          dot.className = 'status-dot shipped';
          text.textContent = 'Shipped';
          if (data.trackingUrl) {
            trackingBox.innerHTML = 'Carrier: ' + (data.carrier || 'N/A') +
              '<br>Tracking #: ' + (data.trackingNumber || 'N/A') +
              '<br><a href="' + data.trackingUrl + '" target="_blank" rel="noopener">Track package →</a>';
          } else {
            trackingBox.innerHTML = 'Carrier: ' + (data.carrier || 'N/A') +
              '<br>Tracking #: ' + (data.trackingNumber || 'N/A');
          }
          trackingBox.style.display = 'block';
        } else {
          dot.className = 'status-dot processing';
          text.textContent = 'Processing';
          trackingBox.style.display = 'none';
        }

        resultEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = 'Could not reach the order lookup service. Try again in a moment.';
        errorEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Check';
      }
    });

    if (prefill) {
      document.getElementById('trackForm').dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
