<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin">
<title>Support Lilly — LA LILLY</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{background:#f7f3ed;color:#14120f;min-height:100svh;display:grid;place-items:center;padding:32px 20px}main{width:100%;max-width:600px;border:2px solid #14120f;background:#D3ECAB;padding:42px;box-shadow:9px 9px 0 #CFC5F5}.support-logo{display:block;width:230px;max-width:100%;margin-bottom:42px}.eyebrow{font:12px 'Space Mono',monospace;letter-spacing:2px;text-transform:uppercase}h1{font:clamp(38px,9vw,62px)/1.05 'Archivo Black',sans-serif;letter-spacing:-2px;margin:16px 0 22px}p{line-height:1.65}.amounts{display:flex;gap:10px;margin:26px 0 20px}.amounts button{flex:1;background:#f7f3ed;border:2px solid #14120f;padding:13px;font:700 17px 'Space Grotesk',sans-serif;cursor:pointer}.amounts button[aria-pressed=true]{background:#14120f;color:#fff}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:14px;border:2px solid #14120f;background:#fff;font:inherit}button[type=submit]{width:100%;background:#14120f;color:#fff;border:2px solid #14120f;padding:17px;margin-top:20px;font:700 15px 'Space Mono',monospace;cursor:pointer}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #ff2f7e;outline-offset:4px}.small{font-size:13px;margin:18px 0 0}.back{display:inline-block;margin-top:28px;color:inherit;font:12px 'Space Mono',monospace}.feedback{margin:16px 0 0;font-weight:700}.feedback:empty{display:none}@media(max-width:480px){main{padding:30px 24px}.support-logo{margin-bottom:32px}}
</style></head><body><main>
<img class="support-logo" src="/assets/lalilly-logo.png" alt="LA LILLY">
<span class="eyebrow">A little love for Lilly</span><h1>Keep Lilly<br>looking good.</h1>
<p>Like what we’re making? Send a little support our way. Every contribution helps La Lilly keep creating.</p>
<form id="donation-form">
<div class="amounts" aria-label="Choose a donation amount"><button type="button" data-amount="5" aria-pressed="false">$5</button><button type="button" data-amount="10" aria-pressed="true">$10</button><button type="button" data-amount="25" aria-pressed="false">$25</button></div>
<label for="amount">Your donation (USD)</label><input id="amount" name="amount" type="number" inputmode="decimal" min="1" max="500" step="0.01" value="10" required>
<button type="submit" id="donate">SUPPORT LILLY</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p>
</form><p class="small">A one-time contribution to La Lilly. No product or shipment is included.</p><a class="back" href="/">← BACK TO THE STORE</a>
</main><script src="/donations.js"></script></body></html>
