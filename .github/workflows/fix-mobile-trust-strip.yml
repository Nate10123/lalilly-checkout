name: Fix mobile trust strip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-trust-strip.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix mobile trust strip borders
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          text = path.read_text()
          old = "@media (max-width: 700px) { .trust-strip { grid-template-columns: 1fr; } }"
          new = """@media (max-width: 700px) {
            .trust-strip { grid-template-columns: 1fr; }
            .trust-item {
              border-right: none;
              border-bottom: 2px solid var(--ink);
            }
            .trust-item:last-child { border-bottom: none; }
          }"""
          if old not in text:
              raise SystemExit('Expected trust-strip mobile rule was not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-mobile-trust-strip.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/fix-mobile-trust-strip.yml
          git commit -m "Fix mobile trust strip separators"
          git push origin main
