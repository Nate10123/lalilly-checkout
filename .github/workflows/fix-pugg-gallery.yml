name: Fix Pugg tee gallery

# Runs once when this workflow file is updated.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pugg-gallery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add front and back images to product gallery
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('store.js')
          text = path.read_text(encoding='utf-8')
          needle = """    image: 'assets/products/pugg-stone-wash-heavy-tee-front.png?v=20261013b',
    description: \"A relaxed heavy tee"""
          replacement = """    image: 'assets/products/pugg-stone-wash-heavy-tee-front.png?v=20261013b',
    images: [
      'assets/products/pugg-stone-wash-heavy-tee-front.png?v=20261013b',
      'assets/products/pugg-stone-wash-heavy-tee-back.png?v=20261013b',
    ],
    description: \"A relaxed heavy tee"""
          if needle not in text:
              raise SystemExit('Pugg tee product block was not found or is already updated.')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Commit gallery fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store.js
          git commit -m "Show Pugg tee front and back images"
          git push
