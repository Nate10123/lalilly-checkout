name: Convert Pugg tee images to PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-pugg-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild clean PNG images from original Printify mockups
        run: |
          python -m pip install --quiet pillow requests
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import requests
          from PIL import Image

          base = Path('assets/products')
          images = {
              'pugg-stone-wash-heavy-tee-front.png': 'https://images-api.printify.com/mockup/6abb5dbbe688cdb5400d66ac/403705/146703/the-pugg-stone-wash-heavy-tee.jpg?camera_label=front',
              'pugg-stone-wash-heavy-tee-back.png': 'https://images-api.printify.com/mockup/6abb5dbbe688cdb5400d66ac/403705/146709/the-pugg-stone-wash-heavy-tee.jpg?camera_label=back',
          }

          for filename, url in images.items():
              r = requests.get(url, timeout=60)
              r.raise_for_status()
              with Image.open(BytesIO(r.content)) as im:
                  im.convert('RGB').save(base / filename, format='PNG', optimize=True)

          store = Path('store.js')
          text = store.read_text(encoding='utf-8')
          text = text.replace('pugg-stone-wash-heavy-tee-front.webp?v=20261002', 'pugg-stone-wash-heavy-tee-front.png?v=20261013')
          text = text.replace('pugg-stone-wash-heavy-tee-back.webp?v=20261002', 'pugg-stone-wash-heavy-tee-back.png?v=20261013')
          store.write_text(text, encoding='utf-8')
          PY

      - name: Commit PNG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/pugg-stone-wash-heavy-tee-front.png assets/products/pugg-stone-wash-heavy-tee-back.png store.js
          git rm -f assets/products/pugg-stone-wash-heavy-tee-front.webp assets/products/pugg-stone-wash-heavy-tee-back.webp
          git commit -m "Convert Pugg Stone Wash Heavy Tee images to PNG"
          git push
