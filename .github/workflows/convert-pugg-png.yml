name: Replace Pugg tee images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-pugg-png.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact uploaded product images
        run: |
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-c408-81f5-8b1c-d50c62d555c8/raw?se=2026-10-13T07%3A14%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=10ceb6e0-99bd-5598-bae5-07e2942a545b&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A14%3A10Z&ske=2026-10-14T00%3A14%3A10Z&sks=b&skv=2026-02-06&sig=yv%2Bk1%2BSL9J0lhlPVuaa9vJaydkHjDTSlUfh%2BjjnBYFI%3D' -o assets/products/pugg-stone-wash-heavy-tee-front.png
          curl -L --fail --retry 3 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-67ec-81f7-9b6c-221a29042ba4/raw?se=2026-10-13T07%3A14%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=b577b745-7faf-508c-872e-970c0d35831e&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T00%3A35%3A20Z&ske=2026-10-14T00%3A35%3A20Z&sks=b&skv=2026-02-06&sig=RFiVUlmkU02dzysUF3qbbQ/Qpyc6Y2XMt0DZCdtk64I%3D' -o assets/products/pugg-stone-wash-heavy-tee-back.png

          echo '581e13763e614f96ac0152f06fcf823f89a771618b481897359a4da248325aab  assets/products/pugg-stone-wash-heavy-tee-front.png' | sha256sum -c -
          echo '70e3ada34d42e6d025035a7a961dcaf65aa7f0076fa71461dc9d8ddf68b954d4  assets/products/pugg-stone-wash-heavy-tee-back.png' | sha256sum -c -

          python - <<'PY'
          from pathlib import Path
          p = Path('store.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('pugg-stone-wash-heavy-tee-front.png?v=20261013', 'pugg-stone-wash-heavy-tee-front.png?v=20261013b')
          text = text.replace('pugg-stone-wash-heavy-tee-back.png?v=20261013', 'pugg-stone-wash-heavy-tee-back.png?v=20261013b')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit correct product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/pugg-stone-wash-heavy-tee-front.png assets/products/pugg-stone-wash-heavy-tee-back.png store.js
          git rm -f --ignore-unmatch assets/products/pugg-stone-wash-heavy-tee-front.webp assets/products/pugg-stone-wash-heavy-tee-back.webp
          git rm .github/workflows/convert-pugg-png.yml
          git commit -m "Use correct Pugg Stone Wash Heavy Tee images"
          git push
