name: Convert Pugg tee images to PNG

# One-time trigger commit for product image conversion.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-pugg-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert WebP images to PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          base = Path('assets/products')
          names = [
              'pugg-stone-wash-heavy-tee-front',
              'pugg-stone-wash-heavy-tee-back',
          ]
          for name in names:
              src = base / f'{name}.webp'
              dst = base / f'{name}.png'
              with Image.open(src) as im:
                  im.save(dst, format='PNG', optimize=True)

          store = Path('store.js')
          text = store.read_text(encoding='utf-8')
          text = text.replace('pugg-stone-wash-heavy-tee-front.webp?v=20261002', 'pugg-stone-wash-heavy-tee-front.png?v=20261013')
          text = text.replace('pugg-stone-wash-heavy-tee-back.webp?v=20261002', 'pugg-stone-wash-heavy-tee-back.png?v=20261013')
          store.write_text(text, encoding='utf-8')
          PY

      - name: Commit converted PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/products/pugg-stone-wash-heavy-tee-front.png assets/products/pugg-stone-wash-heavy-tee-back.png store.js
          git rm assets/products/pugg-stone-wash-heavy-tee-front.webp assets/products/pugg-stone-wash-heavy-tee-back.webp
          git commit -m "Convert Pugg Stone Wash Heavy Tee images to PNG"
          git push
