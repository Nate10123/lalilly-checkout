name: Test Printful Los Lillys image URLs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-los-lillys-cdn.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe possible Printful CDN URLs
        run: |
          set +e
          hashes='6accb9943bca8 6accb9943c3d6 6accb9943c53a 6accb9943c1ec 6accb9943c766 6accb9943c078'
          for h in $hashes; do
            echo "HASH $h"
            for u in \
              "https://files.cdn.printful.com/files/${h:0:3}/$h.png" \
              "https://files.cdn.printful.com/files/${h:0:3}/${h}_preview.png" \
              "https://files.cdn.printful.com/files/${h:0:3}/${h}_large.png" \
              "https://files.cdn.printful.com/files/${h:0:3}/$h" \
              "https://files.cdn.printful.com/products/$h.png"; do
              code=$(curl -L -sS --max-time 10 -o /tmp/probe -w '%{http_code}' "$u")
              size=$(wc -c </tmp/probe 2>/dev/null || echo 0)
              type=$(file -b --mime-type /tmp/probe 2>/dev/null || true)
              echo "$code $size $type $u"
            done
          done
