name: Convert Los Lillys images to PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-los-lillys-to-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Convert WebPs to PNGs and update product
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          names = [
              'front',
              'left-front',
              'left',
              'right-front',
              'right',
              'back',
          ]

          for name in names:
              src = Path(f'assets/products/los-lillys-pug-hat-{name}.webp')
              dst = Path(f'assets/products/los-lillys-pug-hat-{name}.png')
              if not src.exists():
                  raise SystemExit(f'Missing source: {src}')
              with Image.open(src) as im:
                  im.load()
                  im.save(dst, 'PNG', optimize=True)
              data = dst.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG generated: {dst}')
              if len(data) < 100_000:
                  raise SystemExit(f'Generated image suspiciously small: {dst} ({len(data)} bytes)')

          product = Path('product-extra.js')
          text = product.read_text(encoding='utf-8')
          text = text.replace('.webp?v=20261013fix', '.png?v=20261022-png1')
          text = text.replace('.webp', '.png')
          product.write_text(text, encoding='utf-8')

          for name in names:
              Path(f'assets/products/los-lillys-pug-hat-{name}.webp').unlink(missing_ok=True)
          PY

      - name: Commit PNG gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/products/los-lillys-pug-hat-* product-extra.js
          git commit -m "Use PNG images for Los Lillys New Pug Hat"
          git push
