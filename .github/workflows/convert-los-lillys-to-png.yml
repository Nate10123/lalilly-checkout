name: Convert Los Lillys images to PNG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-los-lillys-to-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore high-quality historical images and convert to PNG
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PIL import Image

          source_commit = '5e9c7bdefd374e969f45283cf5a74a4bed7e24f6'
          names = ['front', 'left-front', 'left', 'right-front', 'right', 'back']

          for name in names:
              repo_path = f'assets/products/los-lillys-pug-hat-{name}.webp'
              src = Path('/tmp') / f'los-lillys-pug-hat-{name}.webp'
              dst = Path(f'assets/products/los-lillys-pug-hat-{name}.png')

              data = subprocess.check_output(['git', 'show', f'{source_commit}:{repo_path}'])
              src.write_bytes(data)
              if len(data) < 300_000:
                  raise SystemExit(f'Historical source is unexpectedly small: {name} ({len(data)} bytes)')

              with Image.open(src) as im:
                  im.load()
                  if im.size != (2000, 2000):
                      raise SystemExit(f'Unexpected dimensions for {name}: {im.size}')
                  im.save(dst, 'PNG', optimize=True)

              out = dst.read_bytes()
              if out[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG generated: {dst}')
              if len(out) < 300_000:
                  raise SystemExit(f'Generated PNG is unexpectedly small: {name} ({len(out)} bytes)')
              print(f'{name}: historical WebP {len(data)} bytes -> PNG {len(out)} bytes')

          product = Path('product-extra.js')
          text = product.read_text(encoding='utf-8')
          for name in names:
              old = f'assets/products/los-lillys-pug-hat-{name}.webp?v=20261013fix'
              new = f'assets/products/los-lillys-pug-hat-{name}.png?v=20261022-png1'
              text = text.replace(old, new)
          product.write_text(text, encoding='utf-8')

          los_lines = [line for line in text.splitlines() if 'los-lillys-pug-hat-' in line]
          if any('.webp' in line for line in los_lines):
              raise SystemExit('A Los Lillys WebP reference is still present in product-extra.js')

          for name in names:
              Path(f'assets/products/los-lillys-pug-hat-{name}.webp').unlink(missing_ok=True)
          PY

      - name: Commit PNG gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/products/los-lillys-pug-hat-* product-extra.js
          git commit -m "Use PNG images for Los Lillys New Pug Hat"
          git push
