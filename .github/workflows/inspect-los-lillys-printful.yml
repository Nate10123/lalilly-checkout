name: Inspect Los Lillys Printful sync data
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-los-lillys-printful.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed Printful sync data
        run: |
          set -euo pipefail
          url='https://www.lillypug.com/api/printful-sync-product'
          for i in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/product.json -w '%{http_code}' "$url" || true)
            if [ "$code" = "200" ]; then break; fi
            echo "Attempt $i: HTTP $code"
            sleep 5
          done
          echo '--- top level ---'
          jq -c 'keys' /tmp/product.json
          echo '--- product ---'
          jq -c '.result.sync_product // .result' /tmp/product.json
          echo '--- image-like URLs ---'
          jq -r '.. | objects | to_entries[]? | select(.key|test("url|image|thumbnail|preview";"i")) | "\(.key)=\(.value)"' /tmp/product.json | sort -u
          echo '--- files ---'
          jq -c '.result.sync_variants[]? | {id,name,variant_id,product,files}' /tmp/product.json
